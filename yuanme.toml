#:schema ./.yuanme/schemas/yuanme.toml.json

[site]
url = "https://eyuan.me"
title = "Eyuan"
description = "YY's Cave"
language = "en"
author = "Yiyuan Li"

[collections.posts]
route = "/blog/{slug}/"
list_route = "/blog/"
paginate = 10
sort = ["order", "-modified"]

[collections.posts.fields]
date = { type = "date" }
description = { type = "string", max = 250 }
order = { type = "int", min = 1, max = 5, optional = true }
hero = { type = "object", optional = true, fields = { src = { type = "string" }, alt = { type = "string", optional = true } } }

[collections.projects]
route = "/projects/{slug}/"
list_route = "/projects/"
sort = ["order", "-modified"]

[collections.projects.fields]
date = { type = "date" }
description = { type = "string" }
summary = { type = "string", optional = true }
summary_short = { type = "string", optional = true }
stack = { type = "list", items = { type = "string" } }
website = { type = "url", optional = true }
github = { type = "url", optional = true }
order = { type = "int", min = 1, max = 13, optional = true }
hero = { type = "object", optional = true, fields = { url = { type = "string" }, alt = { type = "string", optional = true } } }

[taxonomies.tags]
collections = ["posts"]
route = "/tags/{term}/"
lowercase = true
paginate = 10
sort = ["-modified"]

[taxonomies.series]
collections = ["posts"]
route = "/series/{term}/"
single = true
paginate = 10
sort = ["modified"]

[routes.home]
path = "/"
template = "home.html"

[routes.about]
path = "/about/"
template = "about.html"

[routes.resume]
path = "/resume/"
template = "resume.html"

[routes.archive]
path = "/archive/"
template = "archive.html"

[routes.not_found]
path = "/404.html"
template = "404.html"

[routes.llms]
path = "/llms.txt"
template = "llms.txt"

[feeds.rss]
collections = ["posts"]
path = "/rss.xml"

[router]
mode = "swap"

[host]
adapter = "cloudflare"

[tailwind]
version = "4.3.3"

# This Site's own budgets, measured on it in yuanme#66.
[budgets]
html = 14
css = 11
js = 13
fonts = 64
math_font = 55
requests = 6

# Every Page is over #15's 6 render-path requests, and these acknowledge
# exactly how far (yuanme#76): the Page, the Site's stylesheet and the
# Sidecar stylesheet, the Page Script and the chunk it shares with every
# other Page (the Router and the shell), and four font files, which the
# Engine counts whether or not a Page's text uses them; and code.css on
# Pages with code. Getting to 6 is an Engine change: see yuanme#94.
[budgets.overages]
"/" = { requests = 3 }
"/404.html" = { requests = 3 }
"/about/" = { requests = 3 }
"/archive/" = { requests = 3 }
"/blog/" = { requests = 3 }
"/blog/extending-c-stdlib/" = { requests = 4 }
"/blog/first/" = { requests = 3 }
"/projects/" = { requests = 3 }
"/projects/emaclaude/" = { requests = 3 }
"/projects/hrust/" = { requests = 4 }
"/projects/linear-app/" = { requests = 3 }
"/projects/lrle/" = { requests = 4 }
"/projects/mra/" = { requests = 3 }
"/projects/pew/" = { requests = 4 }
"/projects/rayrust/" = { requests = 4 }
"/projects/rego/" = { requests = 4 }
"/projects/ruskey/" = { requests = 4 }
"/projects/sequel/" = { requests = 4 }
"/projects/shaderview/" = { requests = 3 }
"/projects/shell/" = { requests = 4 }
"/projects/ylib/" = { requests = 3 }
"/resume/" = { requests = 3 }
"/series/" = { requests = 3 }
"/tags/" = { requests = 3 }
"/tags/c/" = { requests = 3 }
"/tags/draft/" = { requests = 3 }
"/tags/life/" = { requests = 3 }
"/tags/programming/" = { requests = 3 }
