{# props: prev?: url, next?: url #}
{% macro pagination(prev=none, next=none) %}
{% if prev or next %}
<nav class="label-mono flex pt-6 text-ink-2">
	{% if prev %}<a href="{{ prev }}" class="page-link">← Prev</a>{% endif %}
	{% if next %}<a href="{{ next }}" class="page-link ms-auto">Next →</a>{% endif %}
</nav>
{% endif %}
{% endmacro %}
