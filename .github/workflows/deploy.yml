# Builds the Site with yuanme and deploys it to Cloudflare Workers, to the
# Worker that wrangler.jsonc names.
# - push to main     -> `wrangler deploy`: the version every route and
#                       custom domain of the Worker serves
# - push to yuanme,  -> `wrangler versions upload`: a preview version, at
#   pull request        https://<branch or pr-N>-eyuan-me.yuann3.workers.dev,
#                       which leaves the deployed version as it is
# Without the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets it only
# builds.
name: Deploy

on:
  push:
    branches: [main, yuanme]
  pull_request:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # yuanme has no release yet, so it is built from this commit of
      # yuann3/yuanme. Once there is one, the two steps that install it
      # become `uses: yuann3/setup-yuanme` with its version.
      YUANME_REV: 2ccec19cc259e6429c336f38394df8881ffa25b3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: yuanme
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.yuanme/bin
          key: yuanme-bin-${{ runner.os }}-${{ env.YUANME_REV }}
      - name: Build yuanme
        if: steps.yuanme.outputs.cache-hit != 'true'
        run: |
          # rav1e's x86_64 assembly.
          sudo apt-get install -y nasm
          git init -q "$RUNNER_TEMP/yuanme"
          cd "$RUNNER_TEMP/yuanme"
          git fetch -q --depth 1 https://github.com/yuann3/yuanme "$YUANME_REV"
          git checkout -q FETCH_HEAD
          rustup toolchain install
          cargo build --release --locked -p yuanme
          install -D target/release/yuanme ~/.yuanme/bin/yuanme
      # Saved here, not at the end of the job, so a failed deploy doesn't
      # build yuanme again.
      - if: steps.yuanme.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.yuanme/bin
          key: ${{ steps.yuanme.outputs.cache-primary-key }}
      - run: echo "$HOME/.yuanme/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .yuanme/cache
          key: yuanme-cache-${{ env.YUANME_REV }}-${{ github.sha }}
          restore-keys: yuanme-cache-${{ env.YUANME_REV }}-
      # The Managed tools, such as the Tailwind CLI, which yuanme downloads
      # the first time a build needs one.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/yuanme/tools
          key: yuanme-tools-${{ env.YUANME_REV }}-${{ hashFiles('yuanme.toml') }}
          restore-keys: yuanme-tools-${{ env.YUANME_REV }}-
      - run: yuanme build --json
      - name: Look for the deploy secrets
        id: secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID secrets, so the Site is built but not deployed."
          fi
      - name: Deploy
        if: steps.secrets.outputs.found == 'true' && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.156.0
          command: deploy
      - name: Upload a preview
        id: preview
        if: steps.secrets.outputs.found == 'true' && !(github.event_name == 'push' && github.ref == 'refs/heads/main')
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: 4.156.0
          command: versions upload --preview-alias ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.ref_name }}
      - if: steps.preview.outputs.deployment-url != ''
        env:
          URL: ${{ steps.preview.outputs.deployment-url }}
        run: echo "Preview at $URL" >> "$GITHUB_STEP_SUMMARY"
